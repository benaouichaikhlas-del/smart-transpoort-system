name: TransportDZ
description: "Transport app"
publish_to: 'none'

version: 1.0.0+1

environment:
  sdk: ">=3.0.0 <4.0.0"

dependencies:
  flutter:
    sdk: flutter

  flutter_localizations:
    sdk: flutter

  intl: any
  http: ^1.2.0
  provider: ^6.1.1
  shared_preferences: ^2.2.2
  google_fonts: ^6.2.1
  flutter_animate: ^4.5.0
  geolocator: ^12.0.0
  flutter_map: ^7.0.2
  latlong2: ^0.9.0
  socket_io_client: ^3.0.2
  flutter_secure_storage: ^11.0.0

dev_dependencies:
  flutter_test:
    sdk: flutter

  flutter_lints: ^4.0.0

flutter:
  uses-material-design: true
  generate: true

  assets:
    - assets/images/transport_algerien_bg.png
    - assets/images/vis.png
    - assets/images/pro.png

